services:\n  db:\n    image: postgres:17-alpine\n    restart: unless-stopped\n    environment:\n      POSTGRES_DB: aniwatch\n      POSTGRES_USER: aniwatch\n      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}\n    volumes:\n      - aniwatch_db:/var/lib/postgresql/data\n    healthcheck:\n      test: ["CMD-SHELL", "pg_isready -U aniwatch -d aniwatch"]\n      interval: 5s\n      timeout: 5s\n      retries: 20\n\n  app:\n    build: .\n    restart: unless-stopped\n    depends_on:\n      db:\n        condition: service_healthy\n    environment:\n      NODE_ENV: production\n      PORT: 3000\n      APP_URL: ${APP_URL:-http://localhost:3000}\n      DATABASE_URL: postgresql://aniwatch:${POSTGRES_PASSWORD:-change-me}@db:5432/aniwatch?schema=public\n      JWT_SECRET: ${JWT_SECRET}\n      PAYPAL_ENV: ${PAYPAL_ENV:-sandbox}\n      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}\n      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}\n      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}\n      PAYPAL_PLAN_ID: ${PAYPAL_PLAN_ID:-}\n      PAYPAL_AUTO_SETUP: ${PAYPAL_AUTO_SETUP:-true}\n      PAYPAL_SUBSCRIPTION_PRICE: ${PAYPAL_SUBSCRIPTION_PRICE:-4.99}\n      PAYPAL_CURRENCY: ${PAYPAL_CURRENCY:-USD}\n      ADS_ENABLED: ${ADS_ENABLED:-true}\n      ADSTERRA_HEADER_KEY: ${ADSTERRA_HEADER_KEY:-}\n      ADSTERRA_RECTANGLE_KEY: ${ADSTERRA_RECTANGLE_KEY:-}\n      ADSTERRA_SIDEBAR_KEY: ${ADSTERRA_SIDEBAR_KEY:-}\n    ports:\n      - "3000:3000"\n\nvolumes:\n  aniwatch_db:\n